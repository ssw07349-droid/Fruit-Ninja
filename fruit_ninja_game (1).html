<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fruit Ninja - Epik Dojo Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@500;700&family=Yuji+Mai&display=swap');

        body {
            font-family: 'Teko', sans-serif;
            background: #0f0a0a;
            color: #fff;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        .dojo-bg {
            background: radial-gradient(circle at center, #2c1a1d 0%, #110809 70%, #050203 100%);
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            cursor: crosshair;
        }

        .glass-panel {
            background: rgba(26, 15, 18, 0.88);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(234, 179, 8, 0.4);
            box-shadow: 0 12px 40px 0 rgba(0, 0, 0, 0.8);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
        }

        /* Rarity Borders & Colors */
        .rarity-common { border-color: #9ca3af; background: radial-gradient(circle, rgba(156,163,175,0.15) 0%, transparent 80%); }
        .rarity-uncommon { border-color: #22c55e; background: radial-gradient(circle, rgba(34,197,94,0.15) 0%, transparent 80%); }
        .rarity-rare { border-color: #3b82f6; background: radial-gradient(circle, rgba(59,130,246,0.15) 0%, transparent 80%); }
        .rarity-epic { border-color: #a855f7; background: radial-gradient(circle, rgba(168,85,247,0.15) 0%, transparent 80%); }
        .rarity-legendary { border-color: #eab308; background: radial-gradient(circle, rgba(234,179,8,0.25) 0%, transparent 80%); }
        .rarity-mythic { border-color: #ec4899; background: radial-gradient(circle, rgba(236,72,153,0.3) 0%, transparent 80%); }

        .btn-blade {
            position: relative;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            overflow: hidden;
        }

        .btn-blade:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.5);
        }

        .btn-blade:active {
            transform: translateY(1px) scale(0.98);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0,0,0,0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(234, 179, 8, 0.5);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(234, 179, 8, 0.8);
        }
    </style>
</head>
<body class="dojo-bg w-screen h-screen overflow-hidden">

    <canvas id="gameCanvas"></canvas>

    <div id="hud" class="fixed top-0 left-0 w-full p-4 pointer-events-none flex justify-between items-start z-10 hidden">
        <div class="flex items-center gap-4 md:gap-6">
            <!-- Score Container -->
            <div class="glass-card px-5 py-2 rounded-2xl flex items-center gap-3">
                <i class="fa-solid fa-trophy text-amber-400 text-3xl"></i>
                <div>
                    <div class="text-xs text-amber-200 uppercase tracking-widest font-sans font-semibold">Ochko</div>
                    <div id="scoreText" class="text-4xl font-bold text-amber-400 leading-none">0</div>
                </div>
            </div>

            <!-- Mode Indicator -->
            <div class="glass-card px-4 py-2 rounded-2xl hidden md:block">
                <div class="text-xs text-neutral-400 uppercase tracking-widest font-sans font-semibold">Rejim</div>
                <div id="modeText" class="text-2xl font-bold text-red-400 leading-none">Klassik</div>
            </div>

            <!-- Lives / Hearts Container (Classic Mode) -->
            <div id="livesContainer" class="glass-card px-4 py-2 rounded-2xl flex items-center gap-2 border border-red-500/30">
                <i class="fa-solid fa-heart text-red-500 text-2xl heart-1 animate-pulse"></i>
                <i class="fa-solid fa-heart text-red-500 text-2xl heart-2 animate-pulse"></i>
                <i class="fa-solid fa-heart text-red-500 text-2xl heart-3 animate-pulse"></i>
            </div>

            <!-- Timer (for Zen / Arcade) -->
            <div id="timerContainer" class="glass-card px-5 py-2 rounded-2xl hidden items-center gap-3">
                <i class="fa-solid fa-hourglass-half text-cyan-400 text-2xl animate-spin"></i>
                <div>
                    <div class="text-xs text-cyan-200 uppercase tracking-widest font-sans font-semibold">Vaqt</div>
                    <div id="timerText" class="text-3xl font-bold text-cyan-400 leading-none">90s</div>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-4 pointer-events-auto">
            <!-- Music Track Selector Widget -->
            <div class="glass-card px-3 py-2 rounded-2xl hidden lg:flex items-center gap-2">
                <i class="fa-solid fa-music text-pink-400 text-lg animate-pulse"></i>
                <select id="musicTrackSelect" onchange="changeMusicTrack(this.value)" class="bg-transparent text-amber-200 text-xs font-bold outline-none cursor-pointer">
                    <option value="epic" class="bg-neutral-900">Epik Dojo Beat</option>
                    <option value="cyber" class="bg-neutral-900">Cyber Ninja</option>
                    <option value="zen" class="bg-neutral-900">Zen Garden</option>
                    <option value="samurai" class="bg-neutral-900">Samuray Barabani</option>
                    <option value="retro" class="bg-neutral-900">8-Bit Retro Arcade</option>
                </select>
            </div>

            <!-- Coins Badge -->
            <div class="glass-card px-4 py-2 rounded-2xl flex items-center gap-2 border border-amber-500/40">
                <i class="fa-solid fa-coins text-amber-400 text-xl"></i>
                <span id="coinCountHUD" class="text-2xl font-bold text-amber-300">0</span>
            </div>

            <!-- Menu Button -->
            <button onclick="showMenu()" class="glass-card hover:bg-white/10 w-12 h-12 rounded-2xl flex items-center justify-center text-xl text-amber-400 transition-all border border-amber-500/30 active:scale-95">
                <i class="fa-solid fa-house"></i>
            </button>
        </div>
    </div>

    <div id="mainMenu" class="fixed inset-0 z-20 flex items-center justify-center bg-black/60 backdrop-blur-md">
        <div class="glass-panel p-8 md:p-10 rounded-3xl max-w-lg w-full mx-4 text-center border-amber-500/40 relative overflow-hidden">
            <div class="absolute -top-10 -left-10 w-40 h-40 bg-red-600/20 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-10 -right-10 w-40 h-40 bg-amber-600/20 rounded-full blur-3xl"></div>

            <h1 class="text-6xl md:text-7xl font-bold tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-red-500 to-amber-200 drop-shadow-lg mb-1">
                FRUIT NINJA
            </h1>
            <p class="text-amber-200/80 font-sans text-sm tracking-widest uppercase mb-8">Epik Dojo & Yuqori Sifatli Katana Do'koni</p>

            <div class="space-y-3 mb-8">
                <button onclick="startGame('classic')" class="btn-blade w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-red-600 to-rose-700 text-white font-bold text-2xl tracking-widest shadow-lg flex items-center justify-between group">
                    <span class="flex items-center gap-3">
                        <i class="fa-solid fa-heart-pulse text-red-300 group-hover:scale-125 transition-transform"></i>
                        Klassik Rejim (3 Jon)
                    </span>
                    <i class="fa-solid fa-chevron-right text-lg text-red-200"></i>
                </button>

                <button onclick="startGame('zen')" class="btn-blade w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-cyan-600 to-blue-700 text-white font-bold text-2xl tracking-widest shadow-lg flex items-center justify-between group">
                    <span class="flex items-center gap-3">
                        <i class="fa-solid fa-yin-yang text-cyan-300 group-hover:rotate-180 transition-transform duration-500"></i>
                        Zen Rejim (90 Soniya)
                    </span>
                    <i class="fa-solid fa-chevron-right text-lg text-cyan-200"></i>
                </button>

                <button onclick="startGame('arcade')" class="btn-blade w-full py-3.5 px-6 rounded-2xl bg-gradient-to-r from-purple-600 to-pink-700 text-white font-bold text-2xl tracking-widest shadow-lg flex items-center justify-between group">
                    <span class="flex items-center gap-3">
                        <i class="fa-solid fa-bolt text-purple-300 group-hover:scale-125 transition-transform"></i>
                        Arcade Rejim (60 Soniya)
                    </span>
                    <i class="fa-solid fa-chevron-right text-lg text-purple-200"></i>
                </button>
            </div>

            <div class="flex items-center gap-4">
                <button onclick="openShop()" class="btn-blade flex-1 py-3 px-4 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-700 text-white font-bold text-xl tracking-wider shadow-lg flex items-center justify-center gap-2">
                    <i class="fa-solid fa-store text-amber-200"></i>
                    Katana Do'koni
                </button>
                <div class="glass-card px-4 py-3 rounded-2xl flex items-center gap-2 border border-amber-500/30">
                    <i class="fa-solid fa-coins text-amber-400 text-xl"></i>
                    <span id="coinCountMenu" class="text-xl font-bold text-amber-300">0</span>
                </div>
            </div>
        </div>
    </div>

    <div id="shopModal" class="fixed inset-0 z-30 flex items-center justify-center bg-black/80 backdrop-blur-lg hidden">
        <div class="glass-panel p-6 md:p-8 rounded-3xl max-w-4xl w-full mx-4 max-h-[90vh] flex flex-col border-amber-500/40 relative">
            <div class="flex items-center justify-between pb-4 border-b border-amber-500/20 mb-4">
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-400 text-3xl"></i>
                    <div>
                        <h2 class="text-3xl font-bold text-amber-400 leading-none">Katana va Qilichlar Do'koni</h2>
                        <p class="text-xs text-neutral-400 font-sans">Yuqori detallashuvga ega afsonaviy katana skinlarini tanlang</p>
                    </div>
                </div>

                <div class="flex items-center gap-4">
                    <div class="glass-card px-4 py-1.5 rounded-xl flex items-center gap-2 border border-amber-500/30">
                        <i class="fa-solid fa-coins text-amber-400 text-lg"></i>
                        <span id="coinCountShop" class="text-xl font-bold text-amber-300">0</span>
                    </div>
                    <button onclick="closeShop()" class="w-10 h-10 rounded-xl glass-card hover:bg-white/10 flex items-center justify-center text-amber-400 text-xl transition-all">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <div class="flex items-center gap-2 overflow-x-auto pb-3 mb-4 font-sans text-xs">
                <button onclick="filterShop('all', event)" class="shop-tab active px-3 py-1.5 rounded-xl bg-amber-500/20 border border-amber-500/50 text-amber-300 font-bold whitespace-nowrap">Barchasi</button>
                <button onclick="filterShop('common', event)" class="shop-tab px-3 py-1.5 rounded-xl bg-gray-500/20 border border-gray-500/40 text-gray-300 font-bold whitespace-nowrap">Common</button>
                <button onclick="filterShop('uncommon', event)" class="shop-tab px-3 py-1.5 rounded-xl bg-green-500/20 border border-green-500/40 text-green-300 font-bold whitespace-nowrap">Uncommon</button>
                <button onclick="filterShop('rare', event)" class="shop-tab px-3 py-1.5 rounded-xl bg-blue-500/20 border border-blue-500/40 text-blue-300 font-bold whitespace-nowrap">Rare</button>
                <button onclick="filterShop('epic', event)" class="shop-tab px-3 py-1.5 rounded-xl bg-purple-500/20 border border-purple-500/40 text-purple-300 font-bold whitespace-nowrap">Epic</button>
                <button onclick="filterShop('legendary', event)" class="shop-tab px-3 py-1.5 rounded-xl bg-yellow-500/20 border border-yellow-500/40 text-yellow-300 font-bold whitespace-nowrap">Legendary</button>
                <button onclick="filterShop('mythic', event)" class="shop-tab px-3 py-1.5 rounded-xl bg-pink-500/20 border border-pink-500/40 text-pink-300 font-bold whitespace-nowrap">Mythic</button>
            </div>

            <div id="shopGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 overflow-y-auto pr-2 flex-1"></div>
        </div>
    </div>

    <div id="gameOverModal" class="fixed inset-0 z-30 flex items-center justify-center bg-black/80 backdrop-blur-lg hidden">
        <div class="glass-panel p-8 rounded-3xl max-w-md w-full mx-4 text-center border-amber-500/40">
            <h2 id="gameOverTitle" class="text-5xl font-bold text-amber-400 mb-2">O'YIN TUGADI!</h2>
            <p id="gameOverSub" class="text-neutral-400 font-sans text-sm mb-6">Ajoyib natija! Sening jangovar maxorating:</p>

            <div class="glass-card p-4 rounded-2xl mb-6 space-y-3">
                <div class="flex justify-between items-center text-xl">
                    <span class="text-neutral-400 font-sans">Yig'ilgan Ochko:</span>
                    <span id="finalScore" class="font-bold text-amber-400 text-3xl">0</span>
                </div>
                <div class="flex justify-between items-center text-xl border-t border-white/10 pt-2">
                    <span class="text-neutral-400 font-sans">Topilgan Tangalar:</span>
                    <span id="finalCoins" class="font-bold text-amber-300 text-2xl flex items-center gap-2">
                        <i class="fa-solid fa-coins text-amber-400 text-lg"></i> +0
                    </span>
                </div>
            </div>

            <div class="flex gap-4">
                <button onclick="restartGame()" class="btn-blade flex-1 py-3 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-700 text-white font-bold text-xl">
                    Qaytadan
                </button>
                <button onclick="showMenu()" class="btn-blade flex-1 py-3 rounded-2xl bg-gradient-to-r from-neutral-700 to-neutral-900 text-white font-bold text-xl">
                    Menyu
                </button>
            </div>
        </div>
    </div>

    <script>
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.muted = false;
                this.bgMusicPlaying = false;
                this.bgMusicTimer = null;
                this.currentTrack = 'epic';

                this.pentatonicScale = [146.83, 155.56, 196.00, 220.00, 261.63, 293.66, 311.13, 392.00, 440.00, 523.25];
                this.cyberScale = [220.00, 246.94, 293.66, 329.63, 392.00, 440.00, 523.25, 587.33];
                this.zenScale = [196.00, 220.00, 261.63, 293.66, 329.63, 392.00];
                this.samuraiScale = [130.81, 146.83, 174.61, 196.00, 220.00, 261.63, 293.66];
                this.retroScale = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99];
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            startBgMusic() {
                this.init();
                if (this.bgMusicPlaying) return;
                this.bgMusicPlaying = true;
                
                let beat = 0;
                const playBeat = () => {
                    if (!this.bgMusicPlaying) return;
                    if (!this.muted && this.ctx) {
                        const now = this.ctx.currentTime;
                        
                        if (this.currentTrack === 'epic') {
                            if (beat % 2 === 0) {
                                const osc = this.ctx.createOscillator();
                                const gain = this.ctx.createGain();
                                osc.type = 'sine';
                                osc.frequency.setValueAtTime(beat % 4 === 0 ? 90 : 55, now);
                                osc.frequency.exponentialRampToValueAtTime(20, now + 0.2);
                                gain.gain.setValueAtTime(0.7, now);
                                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                                osc.connect(gain);
                                gain.connect(this.ctx.destination);
                                osc.start(now);
                                osc.stop(now + 0.2);
                            }

                            if (beat % 2 === 1 || Math.random() < 0.4) {
                                const scale = this.pentatonicScale;
                                const noteFreq = scale[Math.floor(Math.random() * scale.length)];
                                const osc = this.ctx.createOscillator();
                                const gain = this.ctx.createGain();
                                osc.type = 'triangle';
                                osc.frequency.setValueAtTime(noteFreq * (Math.random() > 0.5 ? 1 : 2), now);
                                gain.gain.setValueAtTime(0.25, now);
                                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                                osc.connect(gain);
                                gain.connect(this.ctx.destination);
                                osc.start(now);
                                osc.stop(now + 0.3);
                            }
                        } else if (this.currentTrack === 'cyber') {
                            if (beat % 2 === 0) {
                                const osc = this.ctx.createOscillator();
                                const gain = this.ctx.createGain();
                                osc.type = 'sawtooth';
                                osc.frequency.setValueAtTime(110, now);
                                osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
                                gain.gain.setValueAtTime(0.5, now);
                                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                                osc.connect(gain);
                                gain.connect(this.ctx.destination);
                                osc.start(now);
                                osc.stop(now + 0.15);
                            }
                            const scale = this.cyberScale;
                            const noteFreq = scale[Math.floor(Math.random() * scale.length)];
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'square';
                            osc.frequency.setValueAtTime(noteFreq, now);
                            gain.gain.setValueAtTime(0.18, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(now);
                            osc.stop(now + 0.2);
                        } else if (this.currentTrack === 'zen') {
                            if (beat % 4 === 0) {
                                const scale = this.zenScale;
                                const noteFreq = scale[Math.floor(Math.random() * scale.length)];
                                const osc = this.ctx.createOscillator();
                                const gain = this.ctx.createGain();
                                osc.type = 'sine';
                                osc.frequency.setValueAtTime(noteFreq, now);
                                gain.gain.setValueAtTime(0.35, now);
                                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                                osc.connect(gain);
                                gain.connect(this.ctx.destination);
                                osc.start(now);
                                osc.stop(now + 0.6);
                            }
                        } else if (this.currentTrack === 'samurai') {
                            if (beat % 2 === 0) {
                                const osc = this.ctx.createOscillator();
                                const gain = this.ctx.createGain();
                                osc.type = 'triangle';
                                osc.frequency.setValueAtTime(65, now);
                                osc.frequency.exponentialRampToValueAtTime(30, now + 0.25);
                                gain.gain.setValueAtTime(0.8, now);
                                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                                osc.connect(gain);
                                gain.connect(this.ctx.destination);
                                osc.start(now);
                                osc.stop(now + 0.25);
                            }
                            const scale = this.samuraiScale;
                            const noteFreq = scale[Math.floor(Math.random() * scale.length)];
                            const osc = this.ctx.createOscillator();
                            const gain = this.ctx.createGain();
                            osc.type = 'sawtooth';
                            osc.frequency.setValueAtTime(noteFreq, now);
                            gain.gain.setValueAtTime(0.2, now);
                            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
                            osc.connect(gain);
                            gain.connect(this.ctx.destination);
                            osc.start(now);
                            osc.stop(now + 0.18);
                        } else if (this.currentTrack === 'retro') {
                            if (beat % 2 === 0) {
                                const scale = this.retroScale;
                                const noteFreq = scale[(beat / 2) % scale.length];
                                const osc = this.ctx.createOscillator();
                                const gain = this.ctx.createGain();
                                osc.type = 'square';
                                osc.frequency.setValueAtTime(noteFreq, now);
                                gain.gain.setValueAtTime(0.15, now);
                                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                                osc.connect(gain);
                                gain.connect(this.ctx.destination);
                                osc.start(now);
                                osc.stop(now + 0.12);
                            }
                        }
                    }

                    beat = (beat + 1) % 16;
                    this.bgMusicTimer = setTimeout(playBeat, 140);
                };

                playBeat();
            }

            stopBgMusic() {
                this.bgMusicPlaying = false;
                if (this.bgMusicTimer) clearTimeout(this.bgMusicTimer);
            }

            playSlice() {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(700 + Math.random() * 300, now);
                osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
                gain.gain.setValueAtTime(0.06, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            }

            playSplat() {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200 + Math.random() * 120, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.14);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.14);
            }

            playExplosion() {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(130, now);
                osc.frequency.exponentialRampToValueAtTime(20, now + 0.45);
                gain.gain.setValueAtTime(0.18, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.45);
            }

            playCoin() {
                if (this.muted || !this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(987.77, now);
                osc.frequency.setValueAtTime(1318.51, now + 0.08);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            }
        }

        const sounds = new SoundEngine();

        const KATANA_SKINS = [

        class Fruit {
            constructor(type) {
                this.type = type;
                this.x = Math.random() * (canvas.width - 200) + 100;
                this.y = canvas.height + 60;
                this.radius = type === 'pineapple' ? 48 : (type === 'watermelon' ? 54 : 38);
                
                this.vx = (canvas.width / 2 - this.x) * (Math.random() * 0.008 + 0.004);
                this.vy = -(Math.random() * 4 + 13.5);
                this.gravity = 0.28;
                
                this.rotation = Math.random() * Math.PI * 2;
                this.vRot = (Math.random() - 0.5) * 0.08;

                this.sliced = false;
                this.halves = null;
            }

            update() {
                if (isFrozen) {
                    this.x += this.vx * 0.3;
                    this.y += this.vy * 0.3;
                    this.vy += this.gravity * 0.3;
                    this.rotation += this.vRot * 0.3;
                } else {
                    this.x += this.vx;
                    this.y += this.vy;
                    this.vy += this.gravity;
                    this.rotation += this.vRot;
                }

                if (this.sliced && this.halves) {
                    this.halves.forEach(h => {
                        h.x += h.vx;
                        h.y += h.vy;
                        h.vy += this.gravity;
                        h.rotation += h.vRot;
                    });
                }
            }

            draw() {
                if (!this.sliced) {
                    ctx.save();
                    ctx.translate(this.x, this.y);
                    ctx.rotate(this.rotation);
                    this.drawRealisticFruit(ctx, this.type, this.radius);
                    ctx.restore();
                } else if (this.halves) {
                    this.halves.forEach(h => {
                        ctx.save();
                        ctx.translate(h.x, h.y);
                        ctx.rotate(h.rotation);
                        this.drawRealisticHalf(ctx, this.type, this.radius, h.side);
                        ctx.restore();
                    });
                }
            }

            drawRealisticFruit(ctx, type, r) {
                ctx.save();
                // Drop Shadow
                ctx.shadowColor = 'rgba(0,0,0,0.6)';
                ctx.shadowBlur = 12;
                ctx.shadowOffsetX = 4;
                ctx.shadowOffsetY = 8;

                if (type === 'watermelon') {
                    // Outer Rind Gradient
                    const grad = ctx.createRadialGradient(-r/3, -r/3, 5, 0, 0, r);
                    grad.addColorStop(0, '#22c55e');
                    grad.addColorStop(0.7, '#15803d');
                    grad.addColorStop(1, '#052e16');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, Math.PI * 2);
                    ctx.fill();

                    // Rind stripes
                    ctx.strokeStyle = '#064e3b';
                    ctx.lineWidth = 5;
                    for (let i = -r + 8; i < r; i += 14) {
                        ctx.beginPath();
                        ctx.arc(0, 0, r - 2, i / r, (i + 10) / r);
                        ctx.stroke();
                    }

                    // Specular highlight
                    const spec = ctx.createRadialGradient(-r/2.5, -r/2.5, 2, -r/2.5, -r/2.5, r/2);
                    spec.addColorStop(0, 'rgba(255,255,255,0.4)');
                    spec.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = spec;
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, Math.PI * 2);
                    ctx.fill();

                } else if (type === 'apple') {
                    const grad = ctx.createRadialGradient(-r/3, -r/3, 4, 0, 0, r);
                    grad.addColorStop(0, '#f87171');
                    grad.addColorStop(0.6, '#dc2626');
                    grad.addColorStop(1, '#7f1d1d');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, Math.PI * 2);
                    ctx.fill();

                    // Stem & Leaf
                    ctx.fillStyle = '#78350f';
                    ctx.fillRect(-2, -r - 8, 4, 10);
                    ctx.fillStyle = '#16a34a';
                    ctx.beginPath();
                    ctx.ellipse(8, -r - 6, 8, 4, Math.PI/4, 0, Math.PI * 2);
                    ctx.fill();

                    // Highlight
                    const spec = ctx.createRadialGradient(-r/3, -r/3, 2, -r/3, -r/3, r/2);
                    spec.addColorStop(0, 'rgba(255,255,255,0.5)');
                    spec.addColorStop(1, 'rgba(255,255,255,0)');
                    ctx.fillStyle = spec;
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, Math.PI * 2);
                    ctx.fill();

                } else if (type === 'strawberry') {
                    const grad = ctx.createRadialGradient(0, 0, 5, 0, 0, r);
                    grad.addColorStop(0, '#ef4444');
                    grad.addColorStop(1, '#991b1b');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.moveTo(0, r);
                    ctx.bezierCurveTo(r * 1.1, r * 0.3, r, -r * 0.8, 0, -r);
                    ctx.bezierCurveTo(-r, -r * 0.8, -r * 1.1, r * 0.3, 0, r);
                    ctx.fill();

                    // Seeds & Leaves
                    ctx.fillStyle = '#fde047';
                    for (let a = 0; a < Math.PI * 2; a += 0.8) {
                        ctx.fillRect(Math.cos(a) * (r * 0.5), Math.sin(a) * (r * 0.5), 2.5, 3.5);
                    }
                    ctx.fillStyle = '#15803d';
                    ctx.beginPath();
                    ctx.ellipse(0, -r, 12, 5, 0, 0, Math.PI * 2);
                    ctx.fill();

                } else if (type === 'banana' || type === 'freeze_banana') {
                    const baseColor = type === 'freeze_banana' ? '#38bdf8' : '#facc15';
                    const darkColor = type === 'freeze_banana' ? '#0284c7' : '#ca8a04';
                    
                    const grad = ctx.createLinearGradient(-r, -r, r, r);
                    grad.addColorStop(0, baseColor);
                    grad.addColorStop(1, darkColor);
                    ctx.fillStyle = grad;
                    
                    ctx.beginPath();
                    ctx.ellipse(0, 0, r * 1.3, r * 0.55, Math.PI / 5, 0, Math.PI * 2);
                    ctx.fill();

                    // Ridge lines
                    ctx.strokeStyle = darkColor;
                    ctx.lineWidth = 2.5;
                    ctx.beginPath();
                    ctx.moveTo(-r * 1.1, -4);
                    ctx.lineTo(r * 1.1, -4);
                    ctx.stroke();

                } else if (type === 'pineapple') {
                    const grad = ctx.createRadialGradient(0, 0, 10, 0, 0, r);
                    grad.addColorStop(0, '#f59e0b');
                    grad.addColorStop(1, '#b45309');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, r * 0.85, r, 0, 0, Math.PI * 2);
                    ctx.fill();

                    // Diamond pattern
                    ctx.strokeStyle = '#78350f';
                    ctx.lineWidth = 2;
                    for (let i = -r; i < r; i += 10) {
                        ctx.beginPath();
                        ctx.moveTo(-r, i);
                        ctx.lineTo(r, i + 8);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(-r, i + 8);
                        ctx.lineTo(r, i);
                        ctx.stroke();
                    }

                    // Crown leaves
                    ctx.fillStyle = '#15803d';
                    for (let i = -2; i <= 2; i++) {
                        ctx.beginPath();
                        ctx.ellipse(i * 7, -r - 8, 7, 22, i * 0.25, 0, Math.PI * 2);
                        ctx.fill();
                    }

                } else if (type === 'bomb') {
                    const grad = ctx.createRadialGradient(-10, -10, 5, 0, 0, r);
                    grad.addColorStop(0, '#44403c');
                    grad.addColorStop(0.6, '#1c1917');
                    grad.addColorStop(1, '#0c0a09');
                    ctx.fillStyle = grad;
                    ctx.beginPath();
                    ctx.arc(0, 0, r * 0.85, 0, Math.PI * 2);
                    ctx.fill();

                    // Metallic reflection
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.beginPath();
                    ctx.arc(-r*0.3, -r*0.3, r*0.35, 0, Math.PI * 2);
                    ctx.fill();

                    // Fuse and sparks
                    ctx.strokeStyle = '#d7a152';
                    ctx.lineWidth = 4;
                    ctx.beginPath();
                    ctx.moveTo(0, -r * 0.85);
                    ctx.quadraticCurveTo(12, -r - 12, 22, -r - 20);
                    ctx.stroke();

                    ctx.fillStyle = '#ef4444';
                    ctx.beginPath();
                    ctx.arc(22, -r - 20, 6, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }

            drawRealisticHalf(ctx, type, r, side) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(0, 0, r, side === 'left' ? Math.PI / 2 : -Math.PI / 2, side === 'left' ? Math.PI * 1.5 : Math.PI / 2);
                ctx.closePath();

                if (type === 'watermelon') {
                    const fleshGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, r);
                    fleshGrad.addColorStop(0, '#f43f5e');
                    fleshGrad.addColorStop(0.8, '#e11d48');
                    fleshGrad.addColorStop(1, '#15803d');
                    ctx.fillStyle = fleshGrad;
                    ctx.fill();
                    ctx.lineWidth = 5;
                    ctx.strokeStyle = '#15803d';
                    ctx.stroke();

                    // Watermelon black seeds
                    ctx.fillStyle = '#09090b';
                    for (let i = -r/2; i <= r/2; i += 15) {
                        ctx.beginPath();
                        ctx.ellipse(i, (Math.random()-0.5)*20, 4, 7, Math.PI/4, 0, Math.PI*2);
                        ctx.fill();
                    }
                } else if (type === 'apple') {
                    const fleshGrad = ctx.createRadialGradient(0, 0, 2, 0, 0, r);
                    fleshGrad.addColorStop(0, '#fef08a');
                    fleshGrad.addColorStop(0.8, '#fde047');
                    fleshGrad.addColorStop(1, '#dc2626');
                    ctx.fillStyle = fleshGrad;
                    ctx.fill();
                    ctx.lineWidth = 4;
                    ctx.strokeStyle = '#dc2626';
                    ctx.stroke();
                } else {
                    ctx.fillStyle = '#fde047';
                    ctx.fill();
                }
                ctx.restore();
            }

            slice() {
                if (this.sliced) return;
                this.sliced = true;

                if (this.type === 'bomb') {
                    sounds.playExplosion();
                    createExplosionParticles(this.x, this.y);
                    if (gameMode === 'classic') {
                        lives--;
                        updateLivesAndMissesUI();
                        if (lives <= 0) {
                            endGame("3 TA BOMBA PORTLADI!");
                        }
                    } else {
                        score = Math.max(0, score - 10);
                        document.getElementById('scoreText').innerText = score;
                    }
                    return;
                }

                sounds.playSplat();
                createSplatParticles(this.x, this.y, this.type);

                if (this.type === 'freeze_banana') {
                    isFrozen = true;
                    setTimeout(() => isFrozen = false, 5000);
                }

                score += 1;
                coins += 1;
                savePlayerData();
                updateCoinDisplays();

                document.getElementById('scoreText').innerText = score;

                this.halves = [
                    { x: this.x - 12, y: this.y, vx: -3.5 - Math.random() * 2, vy: this.vy, rotation: this.rotation, vRot: -0.12, side: 'left' },
                    { x: this.x + 12, y: this.y, vx: 3.5 + Math.random() * 2, vy: this.vy, rotation: this.rotation, vRot: 0.12, side: 'right' }
                ];
            }
        }

        function createSplatParticles(x, y, type) {
            let color = '#ef4444';
            if (type === 'apple') color = '#fef08a';
            if (type === 'banana') color = '#facc15';
            if (type === 'freeze_banana') color = '#38bdf8';
            if (type === 'watermelon') color = '#f43f5e';

            for (let i = 0; i < 24; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 14,
                    vy: (Math.random() - 0.5) * 14,
                    radius: Math.random() * 7 + 2,
                    color: color,
                    alpha: 1,
                    decay: Math.random() * 0.025 + 0.008
                });
            }
        }

        function createExplosionParticles(x, y) {
            for (let i = 0; i < 45; i++) {
                particles.push({
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 22,
                    vy: (Math.random() - 0.5) * 22,
                    radius: Math.random() * 9 + 3,
                    color: Math.random() > 0.5 ? '#ef4444' : '#f97316',
                    alpha: 1,
                    decay: 0.02
                });
            }
        }

        function initEvents() {
            window.addEventListener('resize', resizeCanvas);

            canvas.addEventListener('pointerdown', (e) => {
                if (e.button === 0) {
                    // Cooldown tekshiruvi (0.2 sekund)
                    if (Date.now() - lastDragEndTime < DRAG_COOLDOWN_MS) {
                        return;
                    }
                    pointerDown = true;
                    dragStartTime = Date.now();
                    canvas.setPointerCapture(e.pointerId);
                    updatePointerPos(e);
                    sounds.playSlice();
                }
            });

            canvas.addEventListener('pointermove', (e) => {
                if (pointerDown) {
                    // Maksimum 5 sekund drag qilish limitini tekshirish
                    if (Date.now() - dragStartTime > MAX_DRAG_DURATION) {
                        pointerDown = false;
                        lastDragEndTime = Date.now();
                        bladeTrail = [];
                        return;
                    }

                    updatePointerPos(e);
                    bladeTrail.push({ x: currentPointer.x, y: currentPointer.y, time: Date.now() });
                    checkSlices();
                }
            });

            canvas.addEventListener('pointerup', () => {
                if (pointerDown) {
                    pointerDown = false;
                    lastDragEndTime = Date.now();
                }
            });

            canvas.addEventListener('pointercancel', () => {
                if (pointerDown) {
                    pointerDown = false;
                    lastDragEndTime = Date.now();
                }
            });
        }

        function updatePointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            currentPointer.x = e.clientX - rect.left;
            currentPointer.y = e.clientY - rect.top;
        }

        function checkSlices() {
            items.forEach(item => {
                if (!item.sliced) {
                    const dist = Math.hypot(item.x - currentPointer.x, item.y - currentPointer.y);
                    if (dist < item.radius + 38) {
                        item.slice();
                    }
                }
            });
        }

        function drawKatanaAndTrail() {
            const katana = getActiveKatana();

            const now = Date.now();

            if (pointerDown && (now - dragStartTime > MAX_DRAG_DURATION)) {
                pointerDown = false;
                lastDragEndTime = Date.now();
                bladeTrail = [];
            }

            bladeTrail = bladeTrail.filter(p => now - p.time < 200);

            if (bladeTrail.length > 1) {
                ctx.save();
                ctx.beginPath();
                ctx.moveTo(bladeTrail[0].x, bladeTrail[0].y);
                for (let i = 1; i < bladeTrail.length; i++) {
                    ctx.lineTo(bladeTrail[i].x, bladeTrail[i].y);
                }
                ctx.strokeStyle = katana.glow;
                ctx.lineWidth = 14;
                ctx.lineCap = 'round';
                ctx.shadowColor = katana.glow;
                ctx.shadowBlur = 25;
                ctx.stroke();

                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 5;
                ctx.stroke();
                ctx.restore();
            }

            if (pointerDown || bladeTrail.length > 0) {
                ctx.save();
                ctx.translate(currentPointer.x, currentPointer.y);

                let angle = -Math.PI / 4;
                if (bladeTrail.length >= 2) {
                    const p1 = bladeTrail[bladeTrail.length - 2];
                    const p2 = bladeTrail[bladeTrail.length - 1];
                    angle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
                }
                ctx.rotate(angle);

                // Katana Blade with Metallic Gradient and Hamon
                const bladeGrad = ctx.createLinearGradient(0, -6, 0, 6);
                bladeGrad.addColorStop(0, '#ffffff');
                bladeGrad.addColorStop(0.5, katana.color);
                bladeGrad.addColorStop(1, '#94a3b8');

                ctx.fillStyle = bladeGrad;
                ctx.beginPath();
                ctx.moveTo(0, -4);
                ctx.quadraticCurveTo(45, -2, 95, 0);
                ctx.quadraticCurveTo(45, 2, 0, 4);
                ctx.closePath();
                ctx.fill();

                // Razor sharp edge glow
                ctx.strokeStyle = katana.glow;
                ctx.lineWidth = 2;
                ctx.shadowColor = katana.glow;
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.moveTo(0, -4);
                ctx.lineTo(95, 0);
                ctx.stroke();

                // Detailed Tsuba (Guard)
                ctx.fillStyle = '#b45309';
                ctx.beginPath();
                ctx.ellipse(-2, 0, 5, 14, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                // Tsuka (Handle with traditional diamond wrap / tsukamaki)
                ctx.fillStyle = '#1c1917';
                ctx.fillRect(-22, -6, 20, 12);
                
                ctx.strokeStyle = '#fde047';
                ctx.lineWidth = 1.5;
                for (let hx = -20; hx < -4; hx += 5) {
                    ctx.beginPath();
                    ctx.moveTo(hx, -6);
                    ctx.lineTo(hx + 3, 6);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(hx + 3, -6);
                    ctx.lineTo(hx, 6);
                    ctx.stroke();
                }

                ctx.restore();
            }
        }

        function spawnItems() {
            if (!gameActive) return;

            if (Math.random() < 0.04) {
                const types = ['watermelon', 'apple', 'strawberry', 'banana', 'pineapple'];
                if (gameMode !== 'zen' && Math.random() < 0.18) {
                    types.push('bomb');
                }
                if (gameMode === 'arcade' && Math.random() < 0.1) {
                    types.push('freeze_banana');
                }

                const selected = types[Math.floor(Math.random() * types.length)];
                items.push(new Fruit(selected));
            }
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if (gameActive) {
                spawnItems();

                items.forEach((item, index) => {
                    item.update();
                    item.draw();

                    if (item.y > canvas.height + 120) {
                        items.splice(index, 1);
                    }
                });

                particles.forEach((p, index) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= p.decay;

                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    if (p.alpha <= 0) {
                        particles.splice(index, 1);
                    }
                });

                drawKatanaAndTrail();
            }

            requestAnimationFrame(animate);
        }

        window.onload = function() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            initEvents();
            updateCoinDisplays();
            animate();
        };
    </script>
</body>
